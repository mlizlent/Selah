services:
  - type: web
    name: selah
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_COMPANION_API_URL
        sync: false
      - key: VITE_ADMIN_EMAIL_SHIELD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_EMAIL_SHIELD
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
