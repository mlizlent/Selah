services:
  - type: web
    name: selah
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL_SHIELD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEV_ORIGIN
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
